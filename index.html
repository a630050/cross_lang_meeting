<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>跨語言即時對講字幕機 - Cross-Lang Subtitles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="dark-theme">
  <div class="app-container">

    <!-- 頂部導覽列（精簡版，設定全移入 Modal）-->
    <header class="app-header">
      <div class="header-left">
        <h1 class="logo-title">🌐 跨語對講字幕</h1>
        <div class="connection-status" id="connection-status">
          <span class="status-dot disconnected"></span>
          <span class="status-text" id="status-text">未加入房間</span>
          <span class="connected-count" id="connected-count" style="display:none"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="切換主題">🌙</button>
        <!-- 設定按鈕：點擊開啟設定 Modal -->
        <button id="settings-btn" class="icon-btn highlight-btn" title="開啟設定">⚙️</button>
        <button id="share-room-btn" class="icon-btn" title="分享房間 QR 碼" style="display:none">🔗</button>
      </div>
    </header>

    <!-- 字幕主顯示區域（不再有控制列，最大化空間）-->
    <main class="subtitle-container" id="subtitle-container">
      <div class="welcome-card" id="welcome-card">
        <h2>👋 歡迎使用跨語言即時字幕機</h2>
        <p>點擊右上角 <strong>⚙️</strong> 輸入暱稱與房間碼，即可開始對講！</p>
      </div>
      <div class="subtitles-list" id="subtitles-list"></div>
      <div class="interim-card" id="interim-card" style="display: none;">
        <span class="interim-badge">🎙️ 辨識中...</span>
        <span class="interim-text" id="interim-text"></span>
      </div>
    </main>

    <!-- 浮動置底按鈕 -->
    <button id="scroll-bottom-btn" class="scroll-bottom-btn" style="display: none;">↓ 底部</button>

    <!-- 底部：工具列 + 聊天輸入列 -->
    <footer class="app-footer">
      <div class="footer-tool-bar">
        <button id="font-dec-btn" class="tool-btn" title="縮小字號">A-</button>
        <button id="font-inc-btn" class="tool-btn" title="放大字號">A+</button>
        <button id="clear-subtitles-btn" class="tool-btn danger-tool" title="清空字幕">🗑️</button>
      </div>
      <div class="footer-input-bar">
        <textarea
          id="text-input"
          class="text-input"
          placeholder="輸入訊息..."
          rows="1"
          maxlength="500"
          disabled
        ></textarea>
        <button id="send-text-btn" class="send-btn" disabled title="送出文字">送出</button>
        <!-- 麥克風：右下角圓形持續收音 FAB -->
        <button id="mic-fab" class="mic-fab disabled" disabled title="點擊開始／停止持續收音">🎤</button>
      </div>
    </footer>
  </div>

  <!-- ══ 設定 Modal（首次進入自動開啟）══ -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-content settings-modal-content">
      <!-- 關閉按鈕（加入後才允許關閉）-->
      <button class="modal-close-btn" id="close-settings-modal-btn" style="display:none">✕</button>
      <h3>⚙️ 對講設定</h3>

      <!-- 暱稱 -->
      <div class="settings-field">
        <label for="nickname-input">👤 我的暱稱（對方看得到）</label>
        <input type="text" id="nickname-input" placeholder="輸入暱稱" maxlength="12" />
      </div>

      <!-- 加入前：房間碼 + 密碼 + 進入按鈕 -->
      <div id="settings-join-section">
        <div class="settings-field">
          <label for="room-id-input">🚪 房間碼</label>
          <input type="text" id="room-id-input" placeholder="4~12 位，如 8888" maxlength="12" />
        </div>
        <div class="settings-field">
          <label for="room-pwd-input">🔒 密碼（選填）</label>
          <input type="password" id="room-pwd-input" placeholder="留空表示公開房間" maxlength="20" />
        </div>
        <button id="join-room-btn" class="primary-btn full-width-btn">進入房間</button>
      </div>

      <!-- 加入後：狀態 + 離開按鈕 -->
      <div id="settings-joined-section" style="display:none">
        <div class="settings-joined-badge">
          <span class="joined-dot"></span>
          <span>已加入房間 <strong id="joined-room-display"></strong></span>
          <span id="joined-lock-icon" style="display:none" title="已設密碼">🔒</span>
        </div>
        <button id="leave-room-btn" class="leave-btn full-width-btn">🚪 離開房間</button>
      </div>

      <!-- 語言設定（加入前後都可調整）-->
      <div class="settings-field">
        <label for="my-spoken-lang">🌏 我的語言（辨識 + 翻譯目標）</label>
        <select id="my-spoken-lang">
          <option value="zh-TW" selected>繁體中文（臺灣）</option>
          <option value="zh-CN">簡體中文</option>
          <option value="ja-JP">日本語（日本）</option>
          <option value="en-US">English（US）</option>
          <option value="ko-KR">한국어（韓國）</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
          <option value="th-TH">ไทย（泰語）</option>
          <option value="vi-VN">Tiếng Việt（越南）</option>
        </select>
      </div>

      <!-- 加入後才顯示「開始使用」按鈕 -->
      <button id="start-using-btn" class="primary-btn full-width-btn" style="display:none">
        ✅ 開始使用
      </button>

      <div id="delete-hint-area" class="settings-delete-hint" style="display:none">
        💡 自己的氣泡可左滑或點擊 🗑️ 刪除
      </div>
    </div>
  </div>

  <!-- ══ 分享房間 Modal ══ -->
  <div class="modal-backdrop" id="share-modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close-btn" id="close-share-modal-btn">✕</button>
      <h3>📱 掃碼／分享加入房間</h3>
      <p class="modal-room-info">房間碼：<strong id="modal-room-id-display">----</strong></p>
      <div class="qrcode-wrapper" id="qrcode-container"></div>
      <div class="copy-url-bar">
        <input type="text" id="share-url-input" readonly />
        <button id="copy-url-btn" class="primary-btn">複製連結</button>
      </div>
    </div>
  </div>

  <script src="js/translate.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/p2p.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
